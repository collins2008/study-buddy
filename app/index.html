<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6c63ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyBuddy">
  <title>Study Buddy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/highlight.css">
</head>
<body>
  <!-- Top Nav Bar -->
  <header id="app-header">
    <button id="btn-back" class="icon-btn" aria-label="Go back" hidden>&#8592;</button>
    <span id="app-title">Study Buddy</span>
    <div class="header-actions">
      <button id="btn-theme" class="icon-btn" aria-label="Toggle theme">🌙</button>
      <button id="btn-menu" class="icon-btn" aria-label="Menu">&#9776;</button>
    </div>
  </header>

  <!-- Slide-out Menu -->
  <div id="menu-overlay" class="hidden" aria-hidden="true"></div>
  <nav id="side-menu" class="hidden" aria-label="Main menu">
    <div class="menu-header">
      <span class="logo-text">📚 Study Buddy</span>
      <button id="btn-menu-close" class="icon-btn">✕</button>
    </div>
    <ul class="menu-list">
      <li><button class="menu-item" data-view="home">🏠 Home</button></li>
      <li><button class="menu-item" data-view="spaced">⏰ Due Today</button></li>
      <li><button class="menu-item" data-view="weak">🎯 Weak Spots</button></li>
      <li><button class="menu-item" data-view="starred">⭐ Starred</button></li>
      <li><button class="menu-item" data-view="mock">📝 Mock Exam</button></li>
      <li><button class="menu-item" data-view="games">🎮 Games</button></li>
      <li><button class="menu-item" data-view="stats">📊 My Stats</button></li>
      <li class="menu-sep"></li>
      <li><button class="menu-item" data-view="export">💾 Export Progress</button></li>
      <li><button class="menu-item" data-action="import">📥 Import Progress</button></li>
      <li><button class="menu-item" data-view="flags">🚩 Flagged Questions</button></li>
      <li><button class="menu-item" data-view="offline">📡 Offline Cache</button></li>
    </ul>
    <div class="menu-footer">v1.0 — Nile University 200L</div>
  </nav>

  <!-- Streak / Goal Bar -->
  <div id="streak-bar" hidden>
    <span id="streak-display">🔥 <strong id="streak-count">0</strong> day streak</span>
    <span id="goal-display">Goal: <strong id="goal-done">0</strong>/<strong id="goal-total">20</strong></span>
  </div>

  <!-- Main App Container -->
  <main id="app-main">
    <!-- Views are rendered here by JavaScript -->
    <div id="view-container"></div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" aria-live="polite" aria-atomic="true"></div>

  <!-- Import File Input (hidden) -->
  <input type="file" id="import-file" accept=".json" style="display:none">

  <!-- Scripts -->
  <script src="js/highlight.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sr.js"></script>
  <script src="js/renderers.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
